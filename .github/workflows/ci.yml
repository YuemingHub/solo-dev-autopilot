# ============================================
# Solo Dev Autopilot — 仓库自检 CI
# 本仓库的产品是"配置包"，没有 package.json，
# 所以 CI 验证自己的产品：
#   JSON 有效性 / SKILL.md 格式 / Shell 语法
# 逻辑在 scripts/ci-self-check.sh（本地可跑同一脚本）
#
# 如果你要的是 Node 项目 CI 模板，见 templates/ci-node.yml
# ============================================

name: CI — Repo Self-Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # 支持手动触发

permissions:
  contents: read

jobs:
  self-check:
    name: JSON · SKILL.md · Shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run self-check
        run: bash scripts/ci-self-check.sh
